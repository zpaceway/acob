services:
  acob-db:
    build: ./database
    expose:
      - "5432"
    environment:
      # ACOB interface is ACOB_DATABASE_PORTGRES_*; POSTGRES_* is only the
      # translation the official postgres image entrypoint requires.
      ACOB_DATABASE_PORTGRES_DB: ${ACOB_DATABASE_PORTGRES_DB:-acob}
      ACOB_DATABASE_PORTGRES_USER: ${ACOB_DATABASE_PORTGRES_USER:-acob}
      ACOB_DATABASE_PORTGRES_PASSWORD: ${ACOB_DATABASE_PORTGRES_PASSWORD:-acob}
      POSTGRES_DB: ${ACOB_DATABASE_PORTGRES_DB:-acob}
      POSTGRES_USER: ${ACOB_DATABASE_PORTGRES_USER:-acob}
      POSTGRES_PASSWORD: ${ACOB_DATABASE_PORTGRES_PASSWORD:-acob}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - acob
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-acob} -d $${POSTGRES_DB:-acob}"]
      interval: 5s
      timeout: 5s
      retries: 5

  acob-srv:
    build: ./srv
    expose:
      - "58347"
    depends_on:
      acob-db:
        condition: service_healthy
    environment:
      ACOB_SRV_DATA_DIR: /data
      ACOB_SRV_PUBLIC_URL: http://127.0.0.1:${ACOB_PROXY_PORT:-58346}
      ACOB_SRV_HOST: 0.0.0.0
      ACOB_SRV_PORT: 58347
      # Postgres wiring (matches database/ defaults). Override via
      # ACOB_DATABASE_PORTGRES_* or set ACOB_SRV_DATABASE_URL instead.
      ACOB_SRV_DB_HOST: acob-db
      ACOB_SRV_DB_PORT: 5432
      ACOB_SRV_DB_NAME: ${ACOB_DATABASE_PORTGRES_DB:-acob}
      ACOB_SRV_DB_USER: ${ACOB_DATABASE_PORTGRES_USER:-acob}
      ACOB_SRV_DB_PASSWORD: ${ACOB_DATABASE_PORTGRES_PASSWORD:-acob}
      # Prod safety: DEBUG off in Compose. Local `make -C srv dev` still
      # defaults to true when ACOB_SRV_DEBUG is unset.
      ACOB_SRV_DEBUG: ${ACOB_SRV_DEBUG:-false}
      # Dev-only default: change in production via ACOB_SRV_SECRET_KEY env.
      # The server refuses to boot with DEBUG=false and no env secret.
      ACOB_SRV_SECRET_KEY: ${ACOB_SRV_SECRET_KEY:-dev-only-change-me-in-production}
      ACOB_SRV_ALLOWED_HOSTS: ${ACOB_SRV_ALLOWED_HOSTS:-*}
      ACOB_SRV_CSRF_TRUSTED_ORIGINS: ${ACOB_SRV_CSRF_TRUSTED_ORIGINS:-}
      ACOB_SRV_DATABASE_URL: ${ACOB_SRV_DATABASE_URL:-}
    volumes:
      - srv-data:/data
    networks:
      - acob

  acob-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    expose:
      - "58348"
    environment:
      ACOB_MCP_ENDPOINT: ${ACOB_MCP_ENDPOINT:-http://acob-srv:58347}
      ACOB_MCP_API_SAME_ORIGIN: ${ACOB_MCP_API_SAME_ORIGIN:-true}
      ACOB_MCP_TIMEOUT: ${ACOB_MCP_TIMEOUT:-60}
      ACOB_MCP_POLL_INTERVAL: ${ACOB_MCP_POLL_INTERVAL:-0.5}
      ACOB_MCP_HOST: 0.0.0.0
      ACOB_MCP_PORT: 58348
    networks:
      - acob

  acob-browser:
    build:
      context: ./browser
      additional_contexts:
        extension: ${ACOB_EXTENSION_PATH:-./extension/dist}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACOB_BROWSER_HEIGHT: ${ACOB_BROWSER_HEIGHT:-1080}
      ACOB_BROWSER_WIDTH: ${ACOB_BROWSER_WIDTH:-1920}
      ACOB_BROWSER_VNC_ENABLED: ${ACOB_BROWSER_VNC_ENABLED:-false}
      ACOB_BROWSER_DISPLAY: ${ACOB_BROWSER_DISPLAY:-:99}
      ACOB_EXTENSION_SETTINGS: ${ACOB_EXTENSION_SETTINGS:-}
      ACOB_EXTENSION_BASE_URL: ${ACOB_EXTENSION_BASE_URL:-}
      ACOB_EXTENSION_ALLOW_CLEANUP: ${ACOB_EXTENSION_ALLOW_CLEANUP:-}
      ACOB_EXTENSION_INSTRUCTIONS_PER_POLL: ${ACOB_EXTENSION_INSTRUCTIONS_PER_POLL:-}
      ACOB_EXTENSION_MAX_CONCURRENT_EXECUTIONS: ${ACOB_EXTENSION_MAX_CONCURRENT_EXECUTIONS:-}
      ACOB_EXTENSION_MAX_TABS: ${ACOB_EXTENSION_MAX_TABS:-}
      ACOB_EXTENSION_POLL_INTERVAL_MS: ${ACOB_EXTENSION_POLL_INTERVAL_MS:-}
      ACOB_EXTENSION_TAB_LOAD_TIMEOUT_MS: ${ACOB_EXTENSION_TAB_LOAD_TIMEOUT_MS:-}
      ACOB_EXTENSION_HTTP_REQUEST_TIMEOUT_MS: ${ACOB_EXTENSION_HTTP_REQUEST_TIMEOUT_MS:-}
      ACOB_EXTENSION_JAVASCRIPT_TIMEOUT_MS: ${ACOB_EXTENSION_JAVASCRIPT_TIMEOUT_MS:-}
      ACOB_EXTENSION_MAX_SCREENSHOT_SIZE_MIB: ${ACOB_EXTENSION_MAX_SCREENSHOT_SIZE_MIB:-}
      ACOB_EXTENSION_MAX_RECORDING_DURATION_SEC: ${ACOB_EXTENSION_MAX_RECORDING_DURATION_SEC:-}
      ACOB_EXTENSION_MAX_RECORDING_SIZE_MIB: ${ACOB_EXTENSION_MAX_RECORDING_SIZE_MIB:-}
      ACOB_EXTENSION_CONSOLE_TIMEOUT_SEC: ${ACOB_EXTENSION_CONSOLE_TIMEOUT_SEC:-}
      ACOB_EXTENSION_CONSOLE_MAX_SIZE_MIB: ${ACOB_EXTENSION_CONSOLE_MAX_SIZE_MIB:-}
      ACOB_EXTENSION_RESULT_RETRY_ATTEMPTS: ${ACOB_EXTENSION_RESULT_RETRY_ATTEMPTS:-}
      ACOB_EXTENSION_RESULT_RETRY_DELAY_MS: ${ACOB_EXTENSION_RESULT_RETRY_DELAY_MS:-}
      ACOB_EXTENSION_POPUP_STATUS_DURATION_MS: ${ACOB_EXTENSION_POPUP_STATUS_DURATION_MS:-}
      ACOB_EXTENSION_DEBUGGER_PROTOCOL_VERSION: ${ACOB_EXTENSION_DEBUGGER_PROTOCOL_VERSION:-}
    expose:
      - "6080"
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      - acob-proxy
    networks:
      - acob

  acob-proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:${ACOB_PROXY_PORT:-58346}:80"
    depends_on:
      - acob-srv
      - acob-mcp
    networks:
      - acob

networks:
  acob: {}

volumes:
  srv-data: {}
  db-data: {}
