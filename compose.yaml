services:
  acob-srv:
    build: ./srv
    expose:
      - "58347"
    environment:
      ACOB_DATA_DIR: /data
      ACOB_SRV_HOST: 0.0.0.0
      ACOB_SRV_PORT: 58347
    volumes:
      - srv-data:/data
    networks:
      - acob

  acob-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    expose:
      - "58348"
    environment:
      ACOB_ENDPOINT: ${ACOB_ENDPOINT:-http://acob-srv:58347}
      ACOB_TIMEOUT: ${ACOB_TIMEOUT:-60}
      ACOB_POLL_INTERVAL: ${ACOB_POLL_INTERVAL:-0.5}
      ACOB_MCP_HOST: 0.0.0.0
      ACOB_MCP_PORT: 58348
    networks:
      - acob

  acob-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PORT:-58346}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - acob-srv
      - acob-mcp
    networks:
      - acob

networks:
  acob: {}

volumes:
  srv-data: {}
