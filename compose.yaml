services:
  acob-srv:
    build: ./srv
    expose:
      - "58347"
    environment:
      ACOB_DATA_DIR: /data
      ACOB_PUBLIC_URL: http://127.0.0.1:${PORT:-58346}
      ACOB_SRV_HOST: 0.0.0.0
      ACOB_SRV_PORT: 58347
    volumes:
      - srv-data:/data
    networks:
      - acob

  acob-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    expose:
      - "58348"
    environment:
      ACOB_ENDPOINT: ${ACOB_ENDPOINT:-http://acob-srv:58347}
      ACOB_TIMEOUT: ${ACOB_TIMEOUT:-60}
      ACOB_POLL_INTERVAL: ${ACOB_POLL_INTERVAL:-0.5}
      ACOB_MCP_HOST: 0.0.0.0
      ACOB_MCP_PORT: 58348
    networks:
      - acob

  acob-browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
    environment:
      ACOB_BROWSER_HEIGHT: ${ACOB_BROWSER_HEIGHT:-1080}
      ACOB_BROWSER_WIDTH: ${ACOB_BROWSER_WIDTH:-1920}
      ACOB_VNC_ENABLED: ${ACOB_VNC_ENABLED:-false}
    expose:
      - "6080"
    volumes:
      - browser-data:/data
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      - acob-proxy
    networks:
      - acob

  acob-proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:${PORT:-58346}:80"
    depends_on:
      - acob-srv
      - acob-mcp
    networks:
      - acob

networks:
  acob: {}

volumes:
  browser-data: {}
  srv-data: {}
