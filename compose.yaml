services:
  acob-db:
    build: ./database
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acob}
      POSTGRES_USER: ${POSTGRES_USER:-acob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acob}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - acob
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-acob} -d $${POSTGRES_DB:-acob}"]
      interval: 5s
      timeout: 5s
      retries: 5

  acob-srv:
    build: ./srv
    expose:
      - "58347"
    depends_on:
      acob-db:
        condition: service_healthy
    environment:
      ACOB_DATA_DIR: /data
      ACOB_PUBLIC_URL: http://127.0.0.1:${PORT:-58346}
      ACOB_SRV_HOST: 0.0.0.0
      ACOB_SRV_PORT: 58347
      # Postgres wiring (matches database/ defaults). Override via
      # POSTGRES_* or set ACOB_DATABASE_URL/DATABASE_URL instead.
      ACOB_DB_HOST: acob-db
      ACOB_DB_PORT: 5432
      ACOB_DB_NAME: ${POSTGRES_DB:-acob}
      ACOB_DB_USER: ${POSTGRES_USER:-acob}
      ACOB_DB_PASSWORD: ${POSTGRES_PASSWORD:-acob}
      # Prod safety: DEBUG off in Compose. Local `make -C srv dev` still
      # defaults to true when ACOB_DEBUG is unset.
      ACOB_DEBUG: ${ACOB_DEBUG:-false}
      # Dev-only default: change in production via ACOB_SECRET_KEY env.
      # The server refuses to boot with DEBUG=false and no env secret.
      ACOB_SECRET_KEY: ${ACOB_SECRET_KEY:-dev-only-change-me-in-production}
      ACOB_ALLOWED_HOSTS: ${ACOB_ALLOWED_HOSTS:-*}
    volumes:
      - srv-data:/data
    networks:
      - acob

  acob-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    expose:
      - "58348"
    environment:
      ACOB_ENDPOINT: ${ACOB_ENDPOINT:-http://acob-srv:58347}
      ACOB_API_SAME_ORIGIN: ${ACOB_API_SAME_ORIGIN:-true}
      ACOB_TIMEOUT: ${ACOB_TIMEOUT:-60}
      ACOB_POLL_INTERVAL: ${ACOB_POLL_INTERVAL:-0.5}
      ACOB_MCP_HOST: 0.0.0.0
      ACOB_MCP_PORT: 58348
    networks:
      - acob

  acob-browser:
    build:
      context: ./browser
      additional_contexts:
        extension: ${ACOB_EXTENSION_PATH:-./extension/dist}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACOB_BROWSER_HEIGHT: ${ACOB_BROWSER_HEIGHT:-1080}
      ACOB_BROWSER_WIDTH: ${ACOB_BROWSER_WIDTH:-1920}
      ACOB_EXTENSION_SETTINGS: ${ACOB_EXTENSION_SETTINGS:-}
      ACOB_VNC_ENABLED: ${ACOB_VNC_ENABLED:-false}
    expose:
      - "6080"
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      - acob-proxy
    networks:
      - acob

  acob-proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:${PORT:-58346}:80"
    depends_on:
      - acob-srv
      - acob-mcp
    networks:
      - acob

networks:
  acob: {}

volumes:
  srv-data: {}
  db-data: {}
