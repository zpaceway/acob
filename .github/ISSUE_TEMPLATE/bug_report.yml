---
name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For vulnerabilities, stop here and use
        the private security advisory link in SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Django server or API
        - Chromium extension
        - Python client
        - Build or packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >-
        Provide the release version or commit hash where the issue occurs.
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include relevant OS, Python, Node.js, Chromium, and deployment details.
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.14
        Node.js: 22
        Chromium: 126
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: >-
        Provide the smallest complete sequence that reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Load the extension from ...
        3. Submit ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: >-
        Remove browser IDs, credentials, cookies, screenshots, and sensitive
        page content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I removed secrets and sensitive browser data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
