---
name: Feature request
description: Propose a focused improvement to ACOB.
title: "[Feature]: "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Django server or API
        - Chromium extension
        - Python client
        - Website
        - Build or packaging
        - Documentation
        - Cross-component protocol
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the use case or limitation, not only the proposed
        implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and public API, if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: >-
        Note protocol, storage, API, browser permission, migration, or
        breaking-change effects.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: I am willing to help implement or test this change.
          required: false
