<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACOB Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">Browser bridge</span>
        <h1>ACOB</h1>
      </header>

      <form id="settings-form">
        <div id="configuration-fields"></div>

        <label for="bid">Browser ID</label>
        <div class="bid-row">
          <input id="bid" type="text" readonly />
          <button id="copy-bid" class="secondary" type="button">Copy</button>
        </div>
        <p class="hint">Use this ID in API routes to target this browser.</p>

        <div class="actions">
          <button id="rotate-bid" class="danger" type="button">Rotate ID</button>
          <button type="submit">Save settings</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
