<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACOB Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="m-0 w-[380px] bg-canvas font-sans text-ink scheme-dark [background-image:radial-gradient(circle_at_90%_0%,rgb(200_255_92_/_14%),transparent_38%)]">
    <main class="p-6">
      <header class="mb-6">
        <span class="font-mono text-[11px] tracking-[0.14em] text-acid uppercase">Browser bridge</span>
        <h1 class="mt-0.5 text-3xl leading-none font-bold tracking-[-0.04em]">ACOB</h1>
      </header>

      <form id="settings-form">
        <div id="configuration-fields"></div>

        <label class="mb-[7px] block text-[13px] font-semibold text-label" for="bid">Browser ID</label>
        <div class="grid grid-cols-[1fr_auto] gap-2">
          <input class="h-[42px] w-full rounded-[7px] border border-field-border bg-field px-[11px] font-mono text-xs text-acid outline-none focus:border-acid focus:ring-3 focus:ring-acid/10" id="bid" type="text" readonly />
          <button id="copy-bid" class="min-h-[38px] cursor-pointer rounded-[7px] border border-secondary-border bg-secondary px-[15px] text-xs font-bold text-label hover:brightness-110" type="button">Copy</button>
        </div>
        <p class="mt-1.5 mb-[18px] min-h-[18px] text-[11px] leading-normal text-muted">Use this ID in API routes to target this browser.</p>

        <div class="mt-[22px] flex justify-between gap-2.5">
          <button id="rotate-bid" class="min-h-[38px] cursor-pointer rounded-[7px] border border-danger-border bg-transparent px-[15px] text-xs font-bold text-danger hover:brightness-110" type="button">Rotate ID</button>
          <button class="min-h-[38px] cursor-pointer rounded-[7px] border-0 bg-acid px-[15px] text-xs font-bold text-[#151611] hover:brightness-110" type="submit">Save settings</button>
        </div>
        <p class="mt-3 -mb-1 min-h-4 text-right text-[11px] text-acid" id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
