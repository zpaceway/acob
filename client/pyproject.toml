[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acob-client"
version = "0.14.0"
description = "Asynchronous Python client for Agent Controlled Browser"
authors = [{ name = "zpaceway" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.75",
]

[project.urls]
Repository = "https://github.com/zpaceway/acob"
Issues = "https://github.com/zpaceway/acob/issues"

[tool.hatch.build.targets.wheel]
packages = ["acob"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # the ruff formatter owns trailing commas
    "CPY",   # no per-file copyright headers in this repository
    "D",     # docstring enforcement is out of scope; typing is the contract
    "EM101", # exception messages stay inline in the custom exception classes
    "EM102",
    "PT",    # the project deliberately uses unittest (not pytest)
    "TRY003",
    "TRY004", # heuristic misfires on isinstance-adjacent raises
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic-number comparisons inside test assertions
    "SLF001",  # tests deliberately reach into client internals
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
all = "error"