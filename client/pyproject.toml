[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acob-client"
version = "0.2.0"
description = "Python client for Agent Controlled Browser"
authors = [{ name = "zpaceway" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.urls]
Repository = "https://github.com/zpaceway/acob"
Issues = "https://github.com/zpaceway/acob/issues"

[tool.hatch.build.targets.wheel]
packages = ["acob"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["acob", "tests"]
pythonVersion = "3.10"
