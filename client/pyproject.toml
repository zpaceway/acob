[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acob-client"
version = "0.4.0"
description = "Asynchronous Python client for Agent Controlled Browser"
authors = [{ name = "zpaceway" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[project.urls]
Repository = "https://github.com/zpaceway/acob"
Issues = "https://github.com/zpaceway/acob/issues"

[tool.hatch.build.targets.wheel]
packages = ["acob"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["acob", "tests"]
pythonVersion = "3.10"

[tool.mypy]
python_version = "3.10"
