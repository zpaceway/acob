[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acob-client"
version = "0.1.0"
description = "Python client for Agent Controlled Browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["acob"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["acob", "tests"]
pythonVersion = "3.10"
