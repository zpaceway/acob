[project]
name = "acob-mcp"
version = "0.7.0"
description = "MCP server for controlling a user's existing Chromium session with ACOB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "acob-client>=0.9.0",
    "mcp==2.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
acob-client = { path = "../client", editable = true }

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.10"
