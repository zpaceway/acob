name: acob-mcp

services:
  acob-mcp:
    image: acob-mcp:latest
    container_name: acob-mcp
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    environment:
      DEFAULT_ACOB_ENDPOINT: ${DEFAULT_ACOB_ENDPOINT:-http://host.docker.internal:58347}
      ACOB_TIMEOUT: ${ACOB_TIMEOUT:-60}
      ACOB_POLL_INTERVAL: ${ACOB_POLL_INTERVAL:-0.5}
      ACOB_MCP_HOST: ${ACOB_MCP_HOST:-0.0.0.0}
      ACOB_MCP_PORT: ${ACOB_MCP_PORT:-58349}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ACOB_MCP_PORT:-58349}:${ACOB_MCP_PORT:-58349}"
