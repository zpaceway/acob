worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Allow large captures: 512 MiB recordings + 30 MiB screenshots + overhead.
    client_max_body_size 1024M;
    client_body_buffer_size 128k;

    # MCP Streamable HTTP and long-lived screenshots/recordings need extended timeouts.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # Disable buffering for streaming endpoints.
    proxy_buffering off;
    proxy_request_buffering off;

    # Docker embedded DNS – required when proxy_pass uses a variable
    # so nginx defers resolution to request time instead of startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Map for WebSocket/SSE Upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;

        # MCP – must be before the generic / rule.
        location /mcp/ {
            set $upstream_mcp http://acob-mcp:58348;
            proxy_pass $upstream_mcp;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for MCP Streamable HTTP (SSE) and any Upgrade.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Large payloads should not be buffered to disk.
            client_max_body_size 1024M;
        }

        # Django API + media + all other routes -> srv.
        location / {
            set $upstream_srv http://acob-srv:58347;
            proxy_pass $upstream_srv;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            client_max_body_size 1024M;
        }
    }
}
