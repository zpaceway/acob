include:
  - path: ../srv/compose.yaml
  - path: ../mcp/compose.yaml

services:
  acob-proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PORT:-58346}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - acob-srv
      - acob-mcp
    networks:
      - acob

networks:
  acob: {}
