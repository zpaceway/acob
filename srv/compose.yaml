name: acob-srv

services:
  acob-srv:
    image: acob-srv:latest
    container_name: acob-srv
    build: .
    network_mode: host
    environment:
      ACOB_SRV_HOST: ${ACOB_SRV_HOST:-0.0.0.0}
      ACOB_SRV_PORT: ${ACOB_SRV_PORT:-58347}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_API_KEY: ${STORAGE_API_KEY:-}
