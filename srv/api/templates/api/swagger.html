<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACOB API — Swagger UI</title>
  <link rel="stylesheet" href="/api/docs/assets/swagger-ui.css">
</head>
<body>
  <header>
    <h1>ACOB API</h1>
    <p>API origin: <code>{{ docs.base_url }}</code></p>
    <p><a href="{{ docs.openapi_url }}">OpenAPI JSON</a> · <a href="/api/">Agent quick start</a></p>
  </header>
  <div id="swagger-ui"></div>
  <script src="/api/docs/assets/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/api/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      validatorUrl: null,
      supportedSubmitMethods: ["get", "post"],
      docExpansion: "none"
    });
  </script>
</body>
</html>
