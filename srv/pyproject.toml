[project]
name = "acob"
version = "0.2.0"
description = "Control browser tabs through a Django API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-stubs>=6.0.7",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.black]
target-version = ["py314"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "acob.settings"

[tool.pyright]
include = ["acob", "api", "manage.py"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
"api/migrations/*.py" = ["RUF012"]
